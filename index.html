<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Audioguía Museo - Guía Interactiva</title>
  <meta name="description" content="Ficha de pieza interactiva para audioguía de museo con rutas adaptativas." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            museum: {
              50: '#FAF9F6',
              100: '#F4F2EB',
              200: '#E8E5DA',
              800: '#2C2A26',
              900: '#1C1B18',
              accent: '#C25E28',
              gold: '#D49B35'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    @keyframes soundwave {
      0%, 100% { height: 6px; }
      50% { height: 28px; }
    }
    .wave-bar {
      width: 4px;
      border-radius: 9999px;
      background-color: currentColor;
      transition: height 0.15s ease;
    }
    .playing .wave-bar-1 { animation: soundwave 1.1s ease-in-out infinite 0.1s; }
    .playing .wave-bar-2 { animation: soundwave 0.8s ease-in-out infinite 0.3s; }
    .playing .wave-bar-3 { animation: soundwave 1.3s ease-in-out infinite 0.15s; }
    .playing .wave-bar-4 { animation: soundwave 0.9s ease-in-out infinite 0.4s; }
    .playing .wave-bar-5 { animation: soundwave 1.2s ease-in-out infinite 0.25s; }
    .playing .wave-bar-6 { animation: soundwave 0.85s ease-in-out infinite 0.35s; }

    .faq-content {
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }
  </style>
</head>
<body class="bg-stone-900 text-stone-900 antialiased selection:bg-amber-200 flex justify-center min-h-screen">

  <!-- Marco Móvil Centrado -->
  <div id="app" class="w-full max-w-[480px] min-h-screen bg-[#FAF8F5] shadow-2xl relative flex flex-col pb-28 border-x border-stone-800/20">
    <!-- Contenido inyectado dinámicamente -->
  </div>

  <!-- Modal Selector de Rutas -->
  <div id="route-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="w-full max-w-[480px] bg-[#FAF8F5] rounded-t-3xl p-5 shadow-2xl space-y-4 max-h-[80vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-2 border-b border-stone-200">
        <div>
          <h3 class="text-base font-bold text-stone-900">Elegir Itinerario</h3>
          <p class="text-xs text-stone-500">Adapta el recorrido a tu tiempo disponible</p>
        </div>
        <button onclick="closeRouteModal()" class="w-8 h-8 rounded-full bg-stone-200 text-stone-600 flex items-center justify-center text-sm font-bold">✕</button>
      </div>

      <div class="space-y-2.5" id="route-options-list">
        <!-- Opciones de rutas inyectadas por JS -->
      </div>
    </div>
  </div>

  <!-- Notificaciones Toast -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-16 opacity-0 pointer-events-none">
    <div class="bg-stone-900/95 text-white px-4 py-2.5 rounded-full shadow-lg backdrop-blur-md text-xs font-medium tracking-wide flex items-center gap-2 border border-stone-700/50">
      <span id="toast-icon">✓</span>
      <span id="toast-message">Notificación</span>
    </div>
  </div>

  <!-- Modal Zoom -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-between p-4 hidden opacity-0 transition-opacity duration-300">
    <div class="flex items-center justify-between pt-2 px-2">
      <span class="text-stone-400 text-xs font-mono uppercase tracking-widest" id="modal-image-title">Detalle en Alta Resolución</span>
      <button onclick="closeImageModal()" class="w-10 h-10 rounded-full bg-stone-800/80 text-white flex items-center justify-center hover:bg-stone-700 active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="flex-1 flex items-center justify-center overflow-hidden p-2">
      <img id="modal-img-src" src="" alt="" class="max-h-full max-w-full object-contain rounded-lg shadow-2xl transition-transform duration-300" />
    </div>
    <div class="text-center pb-4">
      <p class="text-stone-400 text-xs">Pellizca con dos dedos para inspeccionar el relieve</p>
    </div>
  </div>

  <!-- ARQUITECTURA JS CON SISTEMA DE RUTAS DESACOPLADO -->
  <script>
    let allPois = [];
    let allRoutes = [];
    let currentRoute = null;
    let poiData = null;

    const appState = {
      isSaved: false,
      speechRate: 1.0,
      activeTab: 'quick',
      foundChallenges: new Set(),
      openFaqIndex: null,
      isSpecsOpen: true,
      audio: {
        isPlaying: false,
        isPaused: false,
        utterance: null,
        progressInterval: null,
        elapsedSeconds: 0,
        estimatedTotalSeconds: 46
      }
    };

    /* Inicialización y descarga del JSON */
    async function initApp() {
      const root = document.getElementById('app');
      root.innerHTML = `
        <div class="flex flex-col items-center justify-center min-h-[60vh] gap-3 text-stone-500">
          <div class="w-8 h-8 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
          <p class="text-xs font-medium tracking-wide">Cargando catálogo e itinerarios...</p>
        </div>
      `;

      try {
        const response = await fetch('antropologia.json');
        if (!response.ok) throw new Error('No se encontró antropologia.json');
        const siteData = await response.json();
        
        allPois = siteData.pois || [];
        allRoutes = siteData.routes || [
          {
            route_id: 'todas',
            title: 'Recorrido General',
            duration: '30 min',
            description: 'Recorrido cronológico completo por la sala.',
            sequence: allPois.map(p => p.poi_id)
          }
        ];

        // Se selecciona por defecto la primera ruta del JSON
        currentRoute = allRoutes[0];
        
        // Iniciar en la primera pieza de la ruta activa
        const firstPoiId = currentRoute.sequence[0] || allPois[0].poi_id;
        loadPoi(firstPoiId);
      } catch (error) {
        console.error("Error al cargar datos:", error);
        root.innerHTML = `
          <div class="p-8 text-center text-stone-600 space-y-3 pt-24">
            <p class="text-3xl">🏛️</p>
            <p class="text-sm font-bold text-stone-900">No se pudo cargar la información</p>
            <p class="text-xs text-stone-500">Verifica tu archivo antropologia.json en GitHub.</p>
          </div>
        `;
      }
    }

    /* Cargar una pieza específica */
    function loadPoi(poiId) {
      const found = allPois.find(p => p.poi_id === poiId);
      if (!found) return;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      resetAudioState();

      appState.foundChallenges.clear();
      appState.openFaqIndex = null;
      appState.activeTab = 'quick';

      poiData = found;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* Cambiar de ruta activa */
    function selectRoute(routeId) {
      const foundRoute = allRoutes.find(r => r.route_id === routeId);
      if (!foundRoute) return;

      currentRoute = foundRoute;
      closeRouteModal();
      showToast(`Itinerario: ${currentRoute.title}`, '🗺️');
      
      // Salta a la primera pieza de la nueva ruta
      loadPoi(currentRoute.sequence[0]);
    }

    /* Modal de Rutas */
    function openRouteModal() {
      const modal = document.getElementById('route-modal');
      const list = document.getElementById('route-options-list');
      if (!modal || !list) return;

      list.innerHTML = allRoutes.map(r => {
        const isSelected = r.route_id === currentRoute.route_id;
        return `
          <div 
            onclick="selectRoute('${r.route_id}')"
            class="p-3.5 rounded-2xl border transition-all cursor-pointer flex items-center justify-between ${
              isSelected ? 'bg-amber-50/90 border-amber-500 shadow-sm' : 'bg-white border-stone-200 hover:border-stone-300'
            }"
          >
            <div class="space-y-0.5">
              <div class="flex items-center gap-2">
                <h4 class="text-xs font-bold text-stone-900">${escapeHtml(r.title)}</h4>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-stone-100 text-stone-600 font-semibold">${r.duration}</span>
              </div>
              <p class="text-[11px] text-stone-500">${escapeHtml(r.description || '')}</p>
              <p class="text-[10px] text-amber-800 font-medium">${r.sequence.length} paradas programadas</p>
            </div>
            ${isSelected ? '<span class="text-amber-600 font-bold text-sm">✓</span>' : ''}
          </div>
        `;
      }).join('');

      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeRouteModal() {
      const modal = document.getElementById('route-modal');
      if (!modal) return;
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    /* RENDERIZADO DINÁMICO */
    function renderApp() {
      const root = document.getElementById('app');
      if (!root || !poiData || !currentRoute) return;

      const { identification, narrative, visual_challenge, curiosities, specs, faqs } = poiData;

      // Cálculo de la posición en la ruta actual
      const currentIndexInRoute = currentRoute.sequence.indexOf(poiData.poi_id);
      const totalSteps = currentRoute.sequence.length;
      const isLastStep = currentIndexInRoute === (totalSteps - 1);
      const nextPoiId = !isLastStep && currentIndexInRoute !== -1 ? currentRoute.sequence[currentIndexInRoute + 1] : null;
      const nextPoi = nextPoiId ? allPois.find(p => p.poi_id === nextPoiId) : null;

      root.innerHTML = `
        <!-- BARRA SUPERIOR -->
        <header class="sticky top-0 z-40 bg-[#FAF8F5]/90 backdrop-blur-md border-b border-stone-200/70 px-4 py-3 flex items-center justify-between">
          <button onclick="handleBackAction()" class="w-9 h-9 -ml-1 rounded-full flex items-center justify-center text-stone-700 hover:bg-stone-200/60 active:scale-95 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"></path></svg>
          </button>

          <!-- Selector de Ruta Activa -->
          <button onclick="openRouteModal()" class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100/70 border border-amber-300/60 text-amber-900 text-xs font-semibold hover:bg-amber-100 transition-all active:scale-95">
            <span>🗺️ ${escapeHtml(currentRoute.title)}</span>
            <span class="text-[10px] text-amber-700">(${currentIndexInRoute + 1}/${totalSteps})</span>
            <span class="text-[9px]">▼</span>
          </button>

          <div class="flex items-center gap-1">
            <button onclick="toggleSaveAction()" id="save-btn" class="w-9 h-9 rounded-full flex items-center justify-center transition-all ${appState.isSaved ? 'text-rose-600 bg-rose-50' : 'text-stone-700 hover:bg-stone-200/60'}">
              <svg class="w-5 h-5 ${appState.isSaved ? 'fill-rose-600 stroke-rose-600' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
          </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 px-4 pt-3 pb-6 space-y-6">

          <!-- FOTO PRINCIPAL -->
          <section class="relative rounded-3xl overflow-hidden shadow-lg bg-stone-950 aspect-square group cursor-pointer" onclick="openImageModal()">
            <img src="${identification.hero_image}" alt="${escapeHtml(identification.title)}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent pointer-events-none"></div>

            <div class="absolute top-3 left-3 flex flex-wrap gap-1.5 max-w-[80%]">
              ${identification.tags.map((tag, idx) => `
                <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold backdrop-blur-md ${idx === 0 ? 'bg-amber-500/90 text-white' : 'bg-black/60 text-stone-200 border border-white/10'}">
                  ${escapeHtml(tag)}
                </span>
              `).join('')}
            </div>

            <div class="absolute bottom-3 left-3 right-3 text-white">
              <span class="text-[11px] font-medium uppercase text-amber-300">${escapeHtml(identification.culture)}</span>
              <p class="text-xs text-stone-300 font-normal line-clamp-1">${escapeHtml(identification.period)}</p>
            </div>
          </section>

          <!-- TÍTULO -->
          <section class="space-y-1.5 pt-1">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded bg-stone-200 text-stone-700 text-[10px] font-bold tracking-widest uppercase">${escapeHtml(identification.culture)}</span>
              <span class="text-stone-400 text-xs">•</span>
              <span class="text-stone-500 text-xs font-medium">${escapeHtml(identification.room)}</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-stone-900 leading-tight">${escapeHtml(identification.title)}</h1>
            <p class="text-sm font-medium text-stone-600 leading-snug">${escapeHtml(narrative.one_liner)}</p>
          </section>

          <!-- REPRODUCTOR DE VOZ -->
          <section class="rounded-2xl p-4 bg-gradient-to-br from-stone-900 to-stone-950 text-white shadow-xl relative overflow-hidden border border-stone-800">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-amber-500"></span>
                </span>
                <span class="text-[11px] font-bold uppercase text-amber-400">Audioguía Oficial</span>
              </div>
              <button onclick="cycleSpeechRate()" class="px-2 py-0.5 text-[10px] font-semibold text-stone-300 bg-stone-800 rounded-full border border-stone-700">
                <span id="speed-label">${appState.speechRate}x</span>
              </button>
            </div>

            <div class="flex items-center gap-4 py-1">
              <button onclick="toggleSpeechAudio()" id="audioguide-play-btn" class="w-13 h-13 shrink-0 rounded-full bg-amber-500 text-stone-950 font-bold flex items-center justify-center shadow-lg active:scale-95 transition-all">
                <svg id="play-icon" class="w-6 h-6 ml-0.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              <div class="flex-1 min-w-0">
                <p class="text-xs font-semibold text-white">Voz de sala guiada</p>
                <p id="audio-status-text" class="text-[11px] text-stone-400">Voz nativa en español</p>
                <div class="w-full bg-stone-700/60 rounded-full h-1.5 overflow-hidden mt-1.5">
                  <div id="audio-progress-bar" class="bg-amber-400 h-full w-0 transition-all duration-300 rounded-full"></div>
                </div>
              </div>
            </div>
          </section>

          <!-- SELECTOR DE LECTURA -->
          <section class="bg-white rounded-2xl p-4 shadow-sm border border-stone-200/80 space-y-3">
            <div class="flex p-1 bg-stone-100 rounded-xl">
              <button onclick="switchTab('quick')" id="tab-btn-quick" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-stone-900 bg-white shadow-sm">Vistazo rápido</button>
              <button onclick="switchTab('expert')" id="tab-btn-expert" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-stone-500">Para expertos</button>
            </div>
            <div class="text-stone-700 text-sm leading-relaxed min-h-[80px]">
              <div id="narrative-content">${escapeHtml(narrative.short_desc)}</div>
            </div>
          </section>

          <!-- RETO VISUAL -->
          <section class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold uppercase tracking-wider text-stone-900">👁️ Busca en la pieza</h2>
              <span id="challenge-counter" class="text-xs font-semibold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                0 de ${visual_challenge.length} encontrados
              </span>
            </div>
            <div class="space-y-2.5">
              ${visual_challenge.map((item, idx) => `
                <div onclick="toggleChallenge('${item.id}')" id="card-${item.id}" class="p-3.5 rounded-2xl bg-white border border-stone-200/80 transition-all cursor-pointer shadow-sm flex items-start gap-3">
                  <div id="check-${item.id}" class="w-5 h-5 mt-0.5 rounded-md border-2 border-stone-300 flex items-center justify-center bg-white shrink-0">
                    <svg class="w-3.5 h-3.5 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                  </div>
                  <div>
                    <h3 class="text-xs font-bold text-stone-900">${escapeHtml(item.title)}</h3>
                    <p class="text-xs text-stone-600 mt-0.5 leading-snug">${escapeHtml(item.clue)}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- CURIOSIDADES -->
          <section class="space-y-3">
            <h2 class="text-sm font-bold uppercase tracking-wider text-stone-900">💡 ¿Sabías qué?</h2>
            <div class="space-y-2.5">
              ${curiosities.map((item, index) => `
                <div class="p-3.5 rounded-2xl bg-gradient-to-br from-amber-50 to-orange-50/60 border border-amber-200/70 shadow-sm flex gap-3">
                  <span class="text-base font-black text-amber-600/40 select-none">#${index + 1}</span>
                  <p class="text-xs leading-relaxed font-medium text-stone-800">${escapeHtml(item.fact)}</p>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- FICHA TÉCNICA -->
          <section class="bg-white rounded-2xl p-4 shadow-sm border border-stone-200/80 space-y-3">
            <div class="flex items-center justify-between cursor-pointer" onclick="toggleSpecsAccordion()">
              <h2 class="text-sm font-bold uppercase tracking-wider text-stone-900">📐 Ficha Técnica</h2>
              <span class="text-stone-400 text-xs">${appState.isSpecsOpen ? '▲' : '▼'}</span>
            </div>
            <div id="specs-body" class="${appState.isSpecsOpen ? 'block' : 'hidden'} pt-1">
              <div class="grid grid-cols-2 gap-2 text-xs">
                ${specs.map(spec => `
                  <div class="p-2.5 rounded-xl bg-stone-50 border border-stone-200/60">
                    <span class="block text-[10px] font-semibold uppercase text-stone-400">${escapeHtml(spec.label)}</span>
                    <span class="font-bold text-stone-900">${escapeHtml(spec.value)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>

          <!-- FAQS -->
          <section class="space-y-3">
            <h2 class="text-sm font-bold uppercase tracking-wider text-stone-900">💬 Preguntas Frecuentes</h2>
            <div class="space-y-2">
              ${faqs.map((faq, index) => `
                <div class="rounded-2xl bg-white border border-stone-200/80 shadow-sm overflow-hidden">
                  <button onclick="toggleFaq(${index})" class="w-full text-left p-3.5 flex items-center justify-between text-xs font-bold text-stone-900">
                    <span>${escapeHtml(faq.question)}</span>
                    <span>${appState.openFaqIndex === index ? '▲' : '▼'}</span>
                  </button>
                  <div id="faq-answer-${index}" class="px-3.5 pb-3 text-xs text-stone-600 border-t border-stone-100 ${appState.openFaqIndex === index ? 'block' : 'hidden'}">
                    <p class="pt-2">${escapeHtml(faq.answer)}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>
        </main>

        <!-- BARRA INFERIOR BASADA EN LA RUTA ACTIVA -->
        <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] p-3 bg-white/90 backdrop-blur-lg border-t border-stone-200/80 z-30 shadow-lg">
          <div class="flex items-center justify-between gap-3">
            ${
              !isLastStep && nextPoi ? `
                <div class="min-w-0 flex-1">
                  <span class="block text-[10px] font-bold uppercase tracking-wider text-amber-700">Siguiente parada (${currentIndexInRoute + 2} de ${totalSteps})</span>
                  <p class="text-xs font-bold text-stone-900 truncate">${escapeHtml(nextPoi.identification.title)}</p>
                </div>
                <button onclick="loadPoi('${nextPoi.poi_id}')" class="px-4 py-2.5 bg-stone-900 text-white text-xs font-bold rounded-xl shadow active:scale-95 transition-all shrink-0">
                  Ir a la pieza →
                </button>
              ` : `
                <div class="min-w-0 flex-1">
                  <span class="block text-[10px] font-bold uppercase tracking-wider text-emerald-700">¡Ruta completada! 🎉</span>
                  <p class="text-xs font-medium text-stone-600 truncate">Has visto todas las paradas</p>
                </div>
                <button onclick="openRouteModal()" class="px-4 py-2.5 bg-amber-600 text-white text-xs font-bold rounded-xl shadow active:scale-95 transition-all shrink-0">
                  Cambiar ruta
                </button>
              `
            }
          </div>
        </footer>
      `;
    }

    /* Utilidades y Audio Nativo */
    function escapeHtml(text) {
      if (typeof text !== 'string') return text;
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function showToast(message, icon = '✓') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      const icn = document.getElementById('toast-icon');
      if (!toast || !msg) return;
      msg.innerText = message;
      if (icn) icn.innerText = icon;
      toast.classList.remove('-translate-y-16', 'opacity-0', 'pointer-events-none');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('-translate-y-16', 'opacity-0', 'pointer-events-none');
      }, 2500);
    }

    function getSpanishVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return voices.find(v => v.lang === 'es-MX' || v.lang === 'es_MX') || voices.find(v => v.lang.startsWith('es')) || voices[0] || null;
    }

    function toggleSpeechAudio() {
      if (!('speechSynthesis' in window)) return showToast('Sin soporte de voz', '⚠️');
      const synth = window.speechSynthesis;
      if (appState.audio.isPlaying && !appState.audio.isPaused) {
        synth.pause();
        appState.audio.isPaused = true;
        updateAudioUIState(false);
        return;
      }
      if (appState.audio.isPaused) {
        synth.resume();
        appState.audio.isPaused = false;
        appState.audio.isPlaying = true;
        updateAudioUIState(true);
        return;
      }
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(poiData.audioguide.audio_script);
      const voice = getSpanishVoice();
      if (voice) utterance.voice = voice;
      utterance.rate = appState.speechRate;
      utterance.onstart = () => {
        appState.audio.isPlaying = true;
        appState.audio.isPaused = false;
        updateAudioUIState(true);
      };
      utterance.onend = () => resetAudioState();
      utterance.onerror = () => resetAudioState();
      synth.speak(utterance);
    }

    function cycleSpeechRate() {
      const rates = [1.0, 1.25, 1.5];
      appState.speechRate = rates[(rates.indexOf(appState.speechRate) + 1) % rates.length];
      const lbl = document.getElementById('speed-label');
      if (lbl) lbl.innerText = `${appState.speechRate}x`;
      if (appState.audio.isPlaying) toggleSpeechAudio();
    }

    function resetAudioState() {
      appState.audio.isPlaying = false;
      appState.audio.isPaused = false;
      updateAudioUIState(false);
      const bar = document.getElementById('audio-progress-bar');
      if (bar) bar.style.width = '0%';
    }

    function updateAudioUIState(isPlaying) {
      const p = document.getElementById('play-icon');
      const pa = document.getElementById('pause-icon');
      if (p && pa) {
        p.classList.toggle('hidden', isPlaying);
        pa.classList.toggle('hidden', !isPlaying);
      }
    }

    function switchTab(tab) {
      appState.activeTab = tab;
      const q = document.getElementById('tab-btn-quick');
      const e = document.getElementById('tab-btn-expert');
      const c = document.getElementById('narrative-content');
      if (tab === 'quick') {
        q.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-stone-900 bg-white shadow-sm';
        e.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-stone-500';
        c.innerHTML = escapeHtml(poiData.narrative.short_desc);
      } else {
        e.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-stone-900 bg-white shadow-sm';
        q.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-stone-500';
        c.innerHTML = escapeHtml(poiData.narrative.deep_desc);
      }
    }

    function toggleChallenge(id) {
      const card = document.getElementById(`card-${id}`);
      const check = document.getElementById(`check-${id}`);
      const svg = check.querySelector('svg');
      if (appState.foundChallenges.has(id)) {
        appState.foundChallenges.delete(id);
        card.classList.remove('bg-amber-50', 'border-amber-400');
        check.classList.remove('bg-amber-500', 'border-amber-500');
        svg.classList.add('hidden');
      } else {
        appState.foundChallenges.add(id);
        card.classList.add('bg-amber-50', 'border-amber-400');
        check.classList.add('bg-amber-500', 'border-amber-500');
        svg.classList.remove('hidden');
      }
      const cnt = document.getElementById('challenge-counter');
      if (cnt) cnt.innerText = `${appState.foundChallenges.size} de ${poiData.visual_challenge.length} encontrados`;
    }

    function toggleFaq(i) {
      appState.openFaqIndex = appState.openFaqIndex === i ? null : i;
      poiData.faqs.forEach((_, idx) => {
        const ans = document.getElementById(`faq-answer-${idx}`);
        if (ans) ans.classList.toggle('hidden', idx !== appState.openFaqIndex);
      });
    }

    function toggleSpecsAccordion() {
      appState.isSpecsOpen = !appState.isSpecsOpen;
      const b = document.getElementById('specs-body');
      if (b) b.classList.toggle('hidden', !appState.isSpecsOpen);
    }

    function toggleSaveAction() {
      appState.isSaved = !appState.isSaved;
      showToast(appState.isSaved ? 'Guardado en favoritos' : 'Eliminado de favoritos');
      renderApp();
    }

    function handleBackAction() {
      showToast('Volver a la selección de salas', '🏛️');
    }

    function openImageModal() {
      const m = document.getElementById('image-modal');
      const img = document.getElementById('modal-img-src');
      if (m && img) {
        img.src = poiData.identification.hero_image;
        m.classList.remove('hidden');
        setTimeout(() => m.classList.remove('opacity-0'), 10);
      }
    }

    function closeImageModal() {
      const m = document.getElementById('image-modal');
      if (m) {
        m.classList.add('opacity-0');
        setTimeout(() => m.classList.add('hidden'), 300);
      }
    }

    /* REGISTRO DE SERVICE WORKER (OFFLINE) */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    document.addEventListener('DOMContentLoaded', () => initApp());
  </script>
</body>
</html>
